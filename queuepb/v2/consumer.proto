// file: proto/gcommon/v2/queue/consumer.proto
// version: 1.0.1
// guid: 1bb92667-7d61-4aea-b8df-a372aa46cf8a

edition = "2023";

package queue.v2;

import "buf/validate/validate.proto";
import "commonpb/v2/consumer_state.proto";
import "google/protobuf/go_features.proto";
import "google/protobuf/timestamp.proto";
import "queuepb/v2/consumer_client.proto";
import "queuepb/v2/consumer_config.proto";
import "queuepb/v2/consumer_stats.proto";

option features.(pb.go).api_level = API_OPAQUE;
option go_package = "github.com/falkcorp/gcommon/v2/pkg/queuepb/v2";

message Consumer {
  // Unique consumer identifier
  string consumer_id = 1 [(buf.validate.field).string.min_len = 1];

  // Consumer client information
  ConsumerClient client_info = 2;

  // Consumer state
  common.v2.ConsumerState state = 3;

  // Assigned partitions
  repeated int32 assigned_partitions = 4 [(buf.validate.field).repeated.min_items = 1];

  // Consumer configuration
  ConsumerConfig config = 5;

  // Consumer statistics
  ConsumerStats stats = 6;

  // Last heartbeat timestamp
  google.protobuf.Timestamp last_heartbeat = 7;

  // Join timestamp
  google.protobuf.Timestamp joined_at = 8;
}
