// file: queuepb/v2/create_topic_request.proto
// version: 1.0.2
// guid: 3f4a5b6c-7d8e-9f0a-1b2c-3d4e5f6a7b8c
//
// Request definitions for queue module
//
edition = "2023";

package queue.v2;

import "buf/validate/validate.proto";
import "google/protobuf/go_features.proto";
import "queuepb/v2/topic_config.proto";

option features.(pb.go).api_level = API_OPAQUE;
option go_package = "github.com/falkcorp/gcommon/v2/pkg/queuepb/v2";

/**
 * Request to create a new topic.
 */
message CreateTopicRequest {
  // Name of the topic to create
  string topic_name = 1 [
    (buf.validate.field).string.min_len = 1,
    (buf.validate.field).string.max_len = 100
  ];

  // Configuration for the topic
  TopicConfig config = 2;

  // Whether the topic should be durable
  bool durable = 3;

  // Whether to auto-delete when unused
  bool auto_delete = 4;

  // Optional arguments for topic creation
  map<string, string> arguments = 5;
}
