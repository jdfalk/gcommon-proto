version: v2
clean: true
# gcommon is protos-only and does NOT generate language code here.
#
# Definitions are published to the Buf Schema Registry (buf.build/falkcorp/gcommon)
# by .github/workflows/buf-push.yml on version tags. Consumers pull generated SDKs
# from BSR for their language:
#   - Go:     go get buf.build/gen/go/falkcorp/gcommon/protocolbuffers/go (+ grpc/go)
#   - Python: pip install ... --extra-index-url https://buf.build/gen/python
#   - Rust/other: add buf.build/falkcorp/gcommon as a buf dep and `buf generate`
#
# This file exists only so `buf generate` validates cleanly (no plugins → no output).
