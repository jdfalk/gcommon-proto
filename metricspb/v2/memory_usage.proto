// file: proto/gcommon/v2/metrics/v2/memory_usage.proto
// version: 1.0.1
// guid: 7ae5e6f3-835f-4ab4-aa43-31e84d7fc642

edition = "2023";

package metrics.v2;

import "buf/validate/validate.proto";
import "google/protobuf/go_features.proto";

option features.(pb.go).api_level = API_OPAQUE;
option go_package = "github.com/falkcorp/gcommon/v2/pkg/metricspb/v2";

message MemoryUsage {
  // Currently used memory (bytes)
  int64 used_bytes = 1 [(buf.validate.field).int64.gte = 0];

  // Memory limit (bytes)
  int64 limit_bytes = 2 [(buf.validate.field).int64.gte = 0];

  // Usage percentage
  double usage_percent = 3 [
    (buf.validate.field).double.gte = 0.0,
    (buf.validate.field).double.lte = 100.0
  ];

  // Peak memory usage (bytes)
  int64 peak_bytes = 4 [(buf.validate.field).int64.gte = 0];
}
