// file: metricspb/v2/configuration_summary.proto
// version: 1.0.2
// guid: 9af1b63b-741f-454d-a992-90c457764c2d

edition = "2023";

package metrics.v2;

import "buf/validate/validate.proto";
import "google/protobuf/go_features.proto";
import "metricspb/v2/resource_limits_summary.proto";
import "metricspb/v2/security_summary.proto";

option features.(pb.go).api_level = API_OPAQUE;
option go_package = "github.com/falkcorp/gcommon/v2/pkg/metricspb/v2";

message ConfigurationSummary {
  // Number of configured exporters
  int32 exporter_count = 1 [
    (buf.validate.field).int32.gte = 1,
    (buf.validate.field).int32.lte = 65535
  ];

  // Security settings summary
  SecuritySummary security = 2;

  // Resource limits summary
  ResourceLimitsSummary resource_limits = 3;

  // Configuration version
  string config_version = 4 [(buf.validate.field).string.pattern = "^v?\\d+\\.\\d+\\.\\d+"];
}
