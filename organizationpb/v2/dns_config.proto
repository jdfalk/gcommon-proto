// file: organizationpb/v2/dns_config.proto
// version: 1.0.2
// guid: 4ce13993-ded9-4ed1-852c-8e73989b5baa

edition = "2023";

package organization.v2;

import "buf/validate/validate.proto";
import "google/protobuf/go_features.proto";
import "organizationpb/v2/dns_record.proto";

option features.(pb.go).api_level = API_OPAQUE;
option go_package = "github.com/falkcorp/gcommon/v2/pkg/organizationpb/v2";

message DNSConfig {
  // DNS provider
  string provider = 1 [(buf.validate.field).string.min_len = 1];

  // DNS zone ID
  string zone_id = 2 [(buf.validate.field).string.min_len = 1];

  // DNS records
  repeated DNSRecord records = 3 [(buf.validate.field).repeated.min_items = 1];

  // TTL for DNS records
  int32 ttl = 4 [(buf.validate.field).int32.gte = 0];
}
