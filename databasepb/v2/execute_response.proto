// file: databasepb/v2/execute_response.proto
// version: 1.0.3
// guid: d8b5ff82-aa9b-4a8d-a4fb-ef485e3d076d
edition = "2023";

package database.v2;

import "buf/validate/validate.proto";
import "commonpb/v2/error.proto";
import "databasepb/v2/execute_stats.proto";
import "google/protobuf/any.proto";
import "google/protobuf/go_features.proto";

option features.(pb.go).api_level = API_OPAQUE;
option go_package = "github.com/falkcorp/gcommon/v2/pkg/databasepb/v2";

/**
 * ExecuteResponse contains the results of a database execute operation.
 * Includes affected row count, generated keys, and execution statistics.
 */
message ExecuteResponse {
  // Number of rows affected by the operation
  int64 affected_rows = 1 [(buf.validate.field).int64.gte = 0];

  // Generated keys from INSERT operations
  repeated google.protobuf.Any generated_keys = 2 [
    lazy = true,
    (buf.validate.field).repeated.min_items = 1
  ];

  // Execution statistics and performance metrics
  ExecuteStats stats = 3 [lazy = true];

  // Error information if the operation failed
  common.v2.Error error = 4 [lazy = true];
}
