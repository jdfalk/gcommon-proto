// file: databasepb/v2/get_memory_usage_response.proto
// version: 1.0.2
// guid: 4bd2a1f2-5469-4fc5-9bdb-e0691a1bbaa9
edition = "2023";

package database.v2;

import "buf/validate/validate.proto";
import "commonpb/v2/error.proto";
import "google/protobuf/go_features.proto";

option features.(pb.go).api_level = API_OPAQUE;
option go_package = "github.com/falkcorp/gcommon/v2/pkg/databasepb/v2";

/**
 * Response for GetMemoryUsage operations.
 */
message GetMemoryUsageResponse {
  // Memory usage in bytes
  int64 memory_usage_bytes = 1 [(buf.validate.field).int64.gte = 0];

  // Memory usage as a percentage of total capacity
  double memory_usage_percent = 2 [
    (buf.validate.field).double.gte = 0.0,
    (buf.validate.field).double.lte = 100.0
  ];

  // Error information if the operation failed
  common.v2.Error error = 3;
}
