edition = "2023";

package database.v2;

import "buf/validate/validate.proto";
import "commonpb/v2/request_metadata.proto";
import "google/protobuf/go_features.proto";

option features.(pb.go).api_level = API_OPAQUE;
option go_package = "github.com/falkcorp/gcommon/v2/pkg/databasepb/v2";

/**
 * Request to check for the existence of a cache key.
 */
message ExistsRequest {
  // Cache key to check
  string key = 1 [(buf.validate.field).string.min_len = 1];

  // Optional namespace
  string namespace = 2 [(buf.validate.field).string.min_len = 1];

  // Request metadata
  common.v2.RequestMetadata metadata = 3 [lazy = true];
}
