# file: .github/workflows/ci.yml
# version: 1.0.1
# guid: ci-workflow-gcommon

name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  security-events: write

jobs:
  ci:
    uses: falkcorp/github-common/.github/workflows/reusable-ci.yml@d0c3326b96557c8ea9117c1c196b628e5e028186 # v1.10.8
    with:
      skip-protobuf: false
      skip-tests: true # No language-specific tests in gcommon
      skip-linting: false
