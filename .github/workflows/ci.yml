# last-edited: 2026-07-24

name: CI

# Protos-only repository: CI validates the protobuf definitions with buf
# (lint + format + breaking-change check). Consumers pull generated SDKs from
# BSR (buf.build/falkcorp/gcommon) for Go/Python/Rust — this repo does not build
# or commit language SDKs. See archive/README.md for the retired multi-language CI.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  buf:
    name: Buf lint / format / breaking
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0 # full history for the breaking-change comparison

      - name: Set up buf
        uses: bufbuild/buf-setup-action@a47c93e0b1648d5651a065437926377d060baa99 # v1.50.0
        with:
          github_token: ${{ github.token }}

      - name: Lint protobuf
        run: buf lint

      - name: Breaking-change check (vs main)
        if: github.event_name == 'pull_request'
        run: buf breaking --against "https://github.com/${{ github.repository }}.git#branch=main"

      # A one-time `buf format -w` pass has been applied to the whole tree, so the
      # format gate is now enforced: any future proto must be pre-formatted.
      - name: Format check
        run: buf format --exit-code
