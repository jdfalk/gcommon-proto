# file: .github/workflows/ci.yml
# version: 1.0.1
# guid: ci-workflow-gcommon

name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  security-events: write

jobs:
  ci:
    uses: jdfalk/ghcommon/.github/workflows/reusable-ci.yml@1a96daebeba7b0f61037be5bc381e3b6794e26b5 # main
    with:
      skip-protobuf: false
      skip-tests: true # No language-specific tests in gcommon
      skip-linting: false
