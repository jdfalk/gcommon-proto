# file: .github/workflows/ci.yml
# version: 1.0.1
# guid: ci-workflow-gcommon

name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  security-events: write

jobs:
  ci:
    uses: jdfalk/ghcommon/.github/workflows/reusable-ci.yml@b06ad4d4a5d38af5a5d974d8af4d7b175317e8ab # main
    with:
      skip-protobuf: false
      skip-tests: true # No language-specific tests in gcommon
      skip-linting: false
