# file: .github/workflows/ci.yml
# version: 1.0.1
# guid: ci-workflow-gcommon

name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  security-events: write

jobs:
  ci:
    uses: jdfalk/ghcommon/.github/workflows/reusable-ci.yml@9fbf36626f62738565c35009c9d22dbc5f68eccf # main
    with:
      skip-protobuf: false
      skip-tests: true # No language-specific tests in gcommon
      skip-linting: false
