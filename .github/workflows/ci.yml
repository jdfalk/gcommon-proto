# file: .github/workflows/ci.yml
# version: 1.0.1
# guid: ci-workflow-gcommon

name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  security-events: write

jobs:
  ci:
    uses: jdfalk/ghcommon/.github/workflows/reusable-ci.yml@7d1de69939871d95024c649cf5214b137bb64fb7 # v1.10.5
    with:
      skip-protobuf: false
      skip-tests: true # No language-specific tests in gcommon
      skip-linting: false
