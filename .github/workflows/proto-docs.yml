name: Proto Docs

on:
  push:
    paths:
      - "proto/**/*.proto"
      - "scripts/generate_proto_docs.py"
      - ".github/workflows/proto-docs.yml"
  workflow_dispatch:
    inputs:
      threshold:
        description: "Split threshold per module"
        required: false
        default: "50"

permissions:
  contents: write # Required to push changes back to the repository

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          submodules: recursive

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.13"

      - name: Generate Proto Docs
        run: |
          python3 scripts/generate_proto_docs.py --proto-dir proto/gcommon/v1 --out proto-docs --threshold "${{ github.event.inputs.threshold || '50' }}"

      - name: Commit Changes
        run: |
          if [[ -n "$(git status --porcelain proto-docs)" ]]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add proto-docs
            git commit -m "docs(proto): regenerate proto markdown documentation"
            git push
          else
            echo "No proto doc changes to commit."
          fi
