// file: commonpb/v2/remove_role_request.proto
// version: 1.0.2
// guid: dfde5734-62db-444c-b390-fda716da06e1
edition = "2023";

package common.v2;

import "buf/validate/validate.proto";
import "commonpb/v2/request_metadata.proto";
import "google/protobuf/go_features.proto";

option features.(pb.go).api_level = API_OPAQUE;
option go_package = "github.com/falkcorp/gcommon/v2/pkg/commonpb/v2";

/**
 * Request to remove a role from a user.
 * Used for role-based access control management.
 * Removes the specified role assignment from the user.
 */
message RemoveRoleRequest {
  // User ID to remove role from
  string user_id = 1 [
    (buf.validate.field).string.pattern = "^[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{12}$",
    (buf.validate.field).required = true
  ];

  // Role ID to remove
  string role_id = 2;

  // Request metadata for tracing and correlation
  common.v2.RequestMetadata metadata = 3;
}
