// file: commonpb/v2/token_info.proto
// version: 1.0.2
// guid: 4c29c1f8-c076-4308-b035-5ac388999383
edition = "2023";

package common.v2;

import "buf/validate/validate.proto";
import "commonpb/v2/token_type.proto";
import "google/protobuf/go_features.proto";
import "google/protobuf/timestamp.proto";

option features.(pb.go).api_level = API_OPAQUE;
option go_package = "github.com/falkcorp/gcommon/v2/pkg/commonpb/v2";

/**
 * Token information for lightweight token tracking.
 * Contains essential token data without sensitive information.
 * Used in responses where full token data is not needed.
 */
message TokenInfo {
  // Token identifier
  string token_id = 1;

  // Token type
  common.v2.TokenType type = 2;

  // User ID associated with token
  string user_id = 3 [
    (buf.validate.field).string.pattern = "^[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{12}$",
    (buf.validate.field).required = true
  ];

  // Client ID that owns the token
  string client_id = 4;

  // Token scopes
  repeated string scopes = 5;

  // Token creation time
  google.protobuf.Timestamp created_at = 6 [(buf.validate.field).required = true];

  // Token expiration time
  google.protobuf.Timestamp expires_at = 7;

  // Token active flag
  bool active = 8;

  // Time until expiration (seconds)
  int64 expires_in = 9;
}
