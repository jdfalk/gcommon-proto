//
// Watch request message definition for streaming health updates
//

edition = "2023";

package common.v2;

import "buf/validate/validate.proto";
import "commonpb/v2/request_metadata.proto";
import "google/protobuf/go_features.proto";

option features.(pb.go).api_level = API_OPAQUE;
option go_package = "github.com/falkcorp/gcommon/v2/pkg/commonpb/v2";

message HealthWatchRequest {
  // Service name to watch (empty for all services)
  string service = 1 [(buf.validate.field).string.min_len = 1];

  // Request metadata
  common.v2.RequestMetadata metadata = 2;
}
