edition = "2023";

package common.v2;

import "buf/validate/validate.proto";
import "commonpb/v2/serving_status.proto";
import "google/protobuf/go_features.proto";

option features.(pb.go).api_level = API_OPAQUE;
option go_package = "github.com/falkcorp/gcommon/v2/pkg/commonpb/v2";

message ComponentHealth {
  // Component name
  string name = 1 [
    (buf.validate.field).string.min_len = 1,
    (buf.validate.field).string.max_len = 100
  ];
  // Component status
  common.v2.ServingStatus status = 2;
  // Component-specific message
  string message = 3;
  // Component check duration in milliseconds
  int64 duration_ms = 4;
}
