edition = "2023";

package common.v2;

import "buf/validate/validate.proto";
import "commonpb/v2/health_status.proto";
import "commonpb/v2/request_metadata.proto";
import "google/protobuf/go_features.proto";

option features.(pb.go).api_level = API_OPAQUE;
option go_package = "github.com/falkcorp/gcommon/v2/pkg/commonpb/v2";

message SetHealthRequest {
  // Service name to update
  string service = 1 [(buf.validate.field).string.min_len = 1];

  // Desired health status
  common.v2.CommonHealthStatus status = 2;

  // Request metadata for auditing
  common.v2.RequestMetadata metadata = 3 [lazy = true];
}
