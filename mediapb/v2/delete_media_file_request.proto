// file: mediapb/v2/delete_media_file_request.proto
// version: 1.0.2
// guid: 9012345-6789-0123-b4c5-d6e7f8a9b0c1

edition = "2023";

package media.v2;

import "buf/validate/validate.proto";
import "google/protobuf/go_features.proto";

option features.(pb.go).api_level = API_OPAQUE;
option go_package = "github.com/falkcorp/gcommon/v2/pkg/mediapb/v2";

// Request to delete a media file.
message DeleteMediaFileRequest {
  string id = 1 [
    (buf.validate.field).string.pattern = "^[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{12}$",
    (buf.validate.field).required = true
  ];
  bool delete_from_storage = 2; // Also delete the physical file
}
