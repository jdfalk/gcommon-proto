// file: webpb/v2/file_upload.proto
// version: 1.1.2
// guid: 47f22269-7456-4237-b463-c287580f662d

edition = "2023";

package web.v2;

import "buf/validate/validate.proto";
import "google/protobuf/go_features.proto";
import "webpb/v2/mime_type.proto";

option features.(pb.go).api_level = API_OPAQUE;
option go_package = "github.com/falkcorp/gcommon/v2/pkg/webpb/v2";

// FileUpload message definition.
message FileUpload {
  // Name of the uploaded file
  string file_name = 1 [
    (buf.validate.field).string.min_len = 1,
    (buf.validate.field).string.max_len = 100
  ];

  // Content type validation
  MimeType content_type = 2;

  // Raw file bytes
  bytes data = 3;

  // Destination path on server
  string destination = 4;
}
